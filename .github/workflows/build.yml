name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk gta-spoiler-guard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gta-spoiler-guard-apk
          path: gta-spoiler-guard.apk

      # APK прикрепляется к релизу — его удобно скачать с телефона:
      # репозиторий → Releases → последний → gta-spoiler-guard.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: gta-spoiler-guard.apk
